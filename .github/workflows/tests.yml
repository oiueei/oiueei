name: Tests

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

# Least-privilege default token, and cancel superseded runs on the same ref.
# Every third-party action is pinned to a full commit SHA (the trailing comment
# is the tag it resolved from): a tag like v6 is movable, so pinning by tag
# would let a compromised action repo swap the code under us. When bumping,
# resolve the new SHA with: git ls-remote https://github.com/<owner>/<repo> "refs/tags/<tag>^{}"
# (fall back to refs/tags/<tag> when the tag is lightweight and has no ^{} line).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    # The suite runs on PostgreSQL because production does. On SQLite Django
    # reports `has_select_for_update = False` and silently drops the FOR UPDATE
    # clause — no warning, the query just runs unlocked — so every row-locked
    # path (booking accept/reject/cancel in `booking_service`, the capacity
    # recheck in `views/things.py`) was proving its logic, never its lock.
    # SQLite also doesn't enforce `CharField(max_length=N)`, which Postgres does.
    #
    # 16 matches the Heroku plan. `development.py` reads DATABASE_URL and falls
    # back to SQLite when it is unset, so a local `pytest` is unchanged.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oiueei
          POSTGRES_PASSWORD: oiueei
          POSTGRES_DB: oiueei_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://oiueei:oiueei@localhost:5432/oiueei_test

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/development.txt

      - name: Check for missing migrations
        env:
          DJANGO_SECRET_KEY: test-secret-key-for-ci-only-not-for-production
          CLOUDINARY_URL: cloudinary://test_key:test_secret@test_cloud
        run: python manage.py makemigrations --check --dry-run

      - name: Lint with Ruff
        run: ruff check .

      - name: Check formatting with Ruff
        run: ruff format --check .

      # The floor is a ratchet, not a target: it sits ~2 points under the suite's
      # real coverage (97.3% at the close of the 2026-08 testing round, which is
      # why this went 94 → 95) so a genuine drop is visible. It stood at 80 long
      # after the suite passed 95, which meant a regression could delete a sixth
      # of the guard and still go green. Raise it as coverage grows; never lower
      # it to make a red build pass.
      - name: Run tests with coverage
        env:
          DJANGO_SECRET_KEY: test-secret-key-for-ci-only-not-for-production
          CLOUDINARY_URL: cloudinary://test_key:test_secret@test_cloud
        run: |
          pytest -v --cov=core --cov-report=xml --cov-report=term-missing --cov-fail-under=95

      - name: Upload coverage reports
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `npm audit --audit-level=high`, minus a written allowlist. The threshold
      # is unchanged; the script exists because npm cannot accept one advisory,
      # so a single unfixable finding would otherwise force the whole gate down
      # to `critical`. Each exception carries its reason and its removal
      # condition in scripts/audit-gate.mjs.
      - name: Audit dependencies
        run: node scripts/audit-gate.mjs

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      # Both files, not just production. The dev tooling runs with checkout and
      # token access on every push, so a compromised test dependency is a
      # supply-chain surface of its own — and auditing production alone is
      # precisely why pytest sat on a version with a known advisory (PYSEC-2026-1845)
      # without anything noticing. Blocking, like the npm gate: if a dev-only
      # advisory ever turns out to be unfixable, it earns a written exception the
      # way frontend/scripts/audit-gate.mjs does, not a quietly dropped check.
      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements/production.txt
          pip-audit -r requirements/development.txt

      - name: Secret scan (gitleaks)
        # The sha256 is from gitleaks_8.21.2_checksums.txt on the release page —
        # verified before extraction so a tampered release asset (or a MITM'd
        # download) fails the job instead of running arbitrary code in CI.
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --redact --no-banner
